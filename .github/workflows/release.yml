name: Release
on:
  push:
    tags: ["v*.*.*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with:
          { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-model.mjs
      - run: node --test scripts/check-doc-parity.test.mjs scripts/verify-release.mjs
      - run: pnpm --filter web-sdk-pp-lcnet-x1-0-doc-ori build
      - run: pnpm lint
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: node scripts/verify-package-assets.mjs
      - run: npm publish --provenance --access public --no-git-checks
        working-directory: packages/sdk

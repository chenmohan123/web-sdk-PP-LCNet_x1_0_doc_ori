name: Pages
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web-sdk-pp-lcnet-x1-0-doc-ori build
      - run: node scripts/verify-package-assets.mjs
      - run: pnpm --filter @pplcnet/demo build
      - run: mkdir -p site/models && cp -R models/* site/models/ && cp -R apps/demo/dist/* site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4

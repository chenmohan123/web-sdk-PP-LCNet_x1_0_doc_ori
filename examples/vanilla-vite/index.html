<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PP-LCNet Vanilla 示例</title>
    <style>
      body {
        margin: 24px auto;
        padding: 0 16px;
        max-width: 760px;
        font: 16px/1.6 system-ui;
        color: #0f172a;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      button,
      select {
        padding: 8px 12px;
      }
      input {
        max-width: 100%;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 16px;
        background: #f8fafc;
      }
    </style>
  </head>
  <body>
    <h1>文档方向检测</h1>
    <p>
      图片仅在浏览器本地处理。模型默认从 ModelScope 下载，首次运行后会缓存。
    </p>
    <div class="controls">
      <label
        >图片
        <input id="image" type="file" accept="image/png,image/jpeg,image/webp"
      /></label>
      <label
        >后端
        <select id="backend">
          <option value="wasm">CPU / WASM</option>
          <option value="webgpu">GPU / WebGPU</option>
        </select></label
      >
      <button id="detect" disabled>开始检测</button>
      <button id="cancel" disabled>取消</button>
    </div>
    <p id="status" role="status">请选择图片</p>
    <pre id="output" aria-label="检测结果"></pre>
    <p>
      <a href="https://chenmohan123.github.io/web-sdk-PP-LCNet_x1_0_doc_ori/"
        >完整 Demo</a
      >
      ·
      <a href="https://github.com/chenmohan123/web-sdk-PP-LCNet_x1_0_doc_ori"
        >GitHub</a
      >
    </p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

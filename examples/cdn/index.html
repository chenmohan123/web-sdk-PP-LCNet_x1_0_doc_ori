<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<input id="file" type="file" accept="image/*" />
<p id="status">Loading SDK...</p>
<pre id="result"></pre>
<script src="https://unpkg.com/web-sdk-pp-lcnet-x1-0-doc-ori/dist/browser-global.global.js"></script>
<script>
  let detector;
  async function load() {
    detector = await PPDocOrientation.createDocOrientation({ backend: "wasm" });
    document.querySelector("#status").textContent = "Choose an image.";
  }
  document.querySelector("#file").addEventListener("change", async (event) => {
    const file = event.target.files?.[0];
    if (!file) return;
    document.querySelector("#status").textContent = "Detecting...";
    const result = await detector.detect(file);
    document.querySelector("#result").textContent = JSON.stringify(result, null, 2);
    document.querySelector("#status").textContent = "Detection complete.";
  });
  void load().catch((error) => {
    document.querySelector("#status").textContent = String(error);
  });
</script>

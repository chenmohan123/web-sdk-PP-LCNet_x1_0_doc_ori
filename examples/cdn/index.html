<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PP-LCNet CDN example</title>
<style>
  body {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
    font:
      16px system-ui,
      sans-serif;
    color: #183b42;
  }
  button {
    min-height: 38px;
    margin-right: 8px;
    padding: 0 12px;
    border: 1px solid #bbc8c3;
    border-radius: 6px;
    background: #fff;
    color: #183b42;
    font: inherit;
    cursor: pointer;
  }
  button:last-of-type {
    color: #fff;
    background: #d95f2b;
    border-color: #d95f2b;
  }
  #status {
    min-height: 24px;
    color: #57706a;
  }
  pre {
    padding: 12px;
    overflow: auto;
    background: #eef1f0;
  }
</style>
<h1>PP-LCNet CDN 示例</h1>
<input id="file" hidden type="file" accept="image/*" />
<button id="choose" type="button">选择图片</button>
<button id="run" type="button" disabled>加载模型并检测</button>
<p id="status" role="status">请选择图片。</p>
<pre id="result"></pre>
<script src="https://unpkg.com/web-sdk-pp-lcnet-x1-0-doc-ori/dist/browser-global.global.js"></script>
<script>
  let selected;
  let detector;
  const file = document.querySelector("#file");
  const status = document.querySelector("#status");
  const run = document.querySelector("#run");
  document.querySelector("#choose").onclick = () => file.click();
  file.onchange = () => {
    selected = file.files?.[0];
    run.disabled = !selected;
    status.textContent = selected ? `已选择 ${selected.name}` : "请选择图片。";
  };
  run.onclick = async () => {
    if (!selected) return;
    run.disabled = true;
    try {
      await detector?.dispose();
      detector = await PPDocOrientation.createDocOrientation({
        backend: "wasm",
      });
      status.textContent = "正在检测…";
      const result = await detector.detect(selected);
      document.querySelector("#result").textContent = JSON.stringify(
        result,
        null,
        2,
      );
      status.textContent = "检测完成。";
    } catch (error) {
      status.textContent = `错误：${String(error)}`;
    } finally {
      run.disabled = false;
    }
  };
</script>

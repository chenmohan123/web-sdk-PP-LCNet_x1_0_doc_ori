<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PP-LCNet WeChat web-view example</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    font:
      16px system-ui,
      sans-serif;
    color: #183b42;
  }
  button {
    min-height: 38px;
    padding: 0 12px;
    border: 1px solid #bbc8c3;
    border-radius: 6px;
    background: #fff;
    font: inherit;
  }
  #status {
    min-height: 24px;
    color: #57706a;
  }
  pre {
    overflow: auto;
    white-space: pre-wrap;
  }
</style>
<h1>微信 H5 / web-view 示例</h1>
<input id="file" hidden type="file" accept="image/*" />
<button id="choose" type="button">选择图片</button>
<p id="status" role="status">请选择图片。</p>
<pre id="result"></pre>
<script type="module">
  import { createDocOrientation } from "https://unpkg.com/web-sdk-pp-lcnet-x1-0-doc-ori/dist/index.js";
  let detector;
  const input = document.querySelector("#file");
  const status = document.querySelector("#status");
  document.querySelector("#choose").onclick = () => input.click();
  input.onchange = async () => {
    const selected = input.files?.[0];
    if (!selected) return;
    status.textContent = "正在检测…";
    try {
      detector ??= await createDocOrientation({ backend: "wasm" });
      const result = await detector.detect(selected);
      document.querySelector("#result").textContent = JSON.stringify(
        result,
        null,
        2,
      );
      status.textContent = "检测完成。";
    } catch (error) {
      status.textContent = `错误：${String(error)}`;
    }
  };
</script>

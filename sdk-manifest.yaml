schemaVersion: "1.1.0"
id: pp-lcnet-x1-0-doc-ori
name: PP-LCNet_x1_0_doc_ori
summary: 在浏览器本地识别文档图片四种朝向并生成纠正角度的独立模型 SDK。
package:
  name: web-sdk-pp-lcnet-x1-0-doc-ori
  version: 0.1.2
repository: https://github.com/chenmohan123/web-sdk-PP-LCNet_x1_0_doc_ori
demo:
  url: https://chenmohan123.github.io/web-sdk-PP-LCNet_x1_0_doc_ori/
  defaultLanguage: zh-CN
  framework: vanilla
  localProcessing: true
docs:
  zhCN: docs/zh-CN/quick-start.md
  en: docs/en/quick-start.md
runtime:
  backends: [wasm, webgpu]
  executionModes: [main, worker]
  # 当前 runtime.backend 来自请求选项，尚无独立的实际后端报告。
  actualBackendReported: false
  runtimeVersion: onnxruntime-web@1.27.0
model:
  id: PP-LCNet_x1_0_doc_ori
  version: 1.0.0
  format: onnx
  parameterCount: 1687613
  precision: [fp32]
  source: https://huggingface.co/PaddlePaddle/PP-LCNet_x1_0_doc_ori_onnx
  license: Apache-2.0
  assets:
    - id: official-fp32
      bytes: 6788069
      precision: fp32
      url: https://chenmohan123.github.io/web-sdk-PP-LCNet_x1_0_doc_ori/models/inference.onnx
      sha256: af9a0a4f317ff0709ce752067807f819cb15d883f8ecad89f28df1c6ee2d9c92
performance:
  # downloadMs 合并下载、校验和缓存写入，不能宣称为标准纯下载耗时。
  timings:
    [sessionMs, decodeMs, preprocessMs, inferenceMs, postprocessMs, totalMs]
  coldStartDefined: false
  warmRunDefined: false
cache:
  storage: [indexeddb, memory]
  versionedKeys: true
  # 现有公开清理接口清空 SDK 缓存，尚不能仅清理当前模型。
  clearCurrent: false
  clearAll: true
  estimate: false
examples:
  vanilla: { status: planned }
  react: { status: available, path: examples/react }
  vue: { status: unsupported }
  cdn: { status: available, path: examples/cdn }
  vite: { status: planned, path: examples/vite }
  wechatWebView: { status: available, path: examples/wechat-web-view }
verification:
  # 此次仅核实声明和部署配置，不扩展浏览器兼容性承诺。
  environments: []

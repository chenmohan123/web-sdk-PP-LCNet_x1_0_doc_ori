  actualBackendReported: true
  runtimeVersion: onnxruntime-web@1.27.0
model:
  id: PP-LCNet_x1_0_doc_ori
  version: 1.0.0
  format: onnx
  parameterCount: 1687613
  precision: [fp32]
  source: https://huggingface.co/PaddlePaddle/PP-LCNet_x1_0_doc_ori_onnx
  license: Apache-2.0
  assets:
    - id: official-fp32
      bytes: 6788069
      precision: fp32
      url: https://chenmohan123.github.io/web-sdk-PP-LCNet_x1_0_doc_ori/models/inference.onnx
      sha256: af9a0a4f317ff0709ce752067807f819cb15d883f8ecad89f28df1c6ee2d9c92
performance:
  timings:
    [modelDownloadMs, modelCacheReadMs, integrityMs, sessionMs, decodeMs, preprocessMs, inferenceMs, postprocessMs, totalMs]
  coldStartDefined: true
  warmRunDefined: true
cache:
  storage: [indexeddb, memory]
  versionedKeys: true
  # 当前作用域为模型 ID 和版本；全部仅限此 SDK 的存储命名空间。
  clearCurrent: true
  clearAll: true
  estimate: true
examples:
  vanilla: { status: available, path: examples/vanilla-vite }
  react: { status: available, path: examples/react }
  vue: { status: unsupported }
  cdn: { status: available, path: examples/cdn }
  vite: { status: available, path: examples/vanilla-vite }
  wechatWebView: { status: available, path: examples/wechat-web-view }
verification:
  # 此次仅核实声明和部署配置，不扩展浏览器兼容性承诺。
  environments: []
